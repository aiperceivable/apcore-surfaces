name: Python surfaces

on:
  push:
    branches: [main]
    paths: &python-paths
      - '*/python/**'
      - '*/conformance/**'
      - '.github/workflows/python.yml'
  pull_request:
    paths: *python-paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.version }} (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [toolkit, mcp, a2a, cli]
        version: ['3.12']
        include:
          - component: toolkit
            version: '3.11'
    defaults:
      run:
        working-directory: ${{ matrix.component }}/python
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.version }}
      - name: Install and verify local dependencies
        shell: bash
        run: |
          args=(-e '.[dev]')
          if [[ "${{ matrix.component }}" != toolkit ]]; then
            args+=(-e "$GITHUB_WORKSPACE/toolkit/python")
          fi
          if [[ -f constraints.txt ]]; then
            args+=(-c constraints.txt)
          fi
          python -m pip install "${args[@]}"
          python -m pip check
          python - <<'PY'
          import os
          from pathlib import Path
          import apcore_toolkit
          expected = Path(os.environ["GITHUB_WORKSPACE"]) / "toolkit/python/src/apcore_toolkit"
          assert Path(apcore_toolkit.__file__).resolve().parent == expected.resolve()
          PY
      - run: ruff check src/ tests/
      - run: python -m pytest

  package:
    name: Python distribution (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [toolkit, mcp, a2a, cli]
    defaults:
      run:
        working-directory: ${{ matrix.component }}/python
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build
      - name: Install and import the built wheel in isolation
        shell: bash
        run: |
          wheel=( "$PWD"/dist/*.whl )
          temporary=$(mktemp -d)
          python -m venv "$temporary/venv"
          cd "$temporary"
          "$temporary/venv/bin/python" -m pip install "${wheel[0]}"
          "$temporary/venv/bin/python" -m pip check
          "$temporary/venv/bin/python" -c 'import importlib, sys; importlib.import_module("apcore_" + sys.argv[1])' "${{ matrix.component }}"
