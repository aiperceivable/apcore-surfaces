name: Python surfaces

on:
  push:
    branches: [main]
    paths: &python-paths
      - '*/python/**'
      - '*/conformance/**'
      - '.github/workflows/python.yml'
  pull_request:
    paths: *python-paths
  workflow_dispatch:

permissions:
  contents: read

env:
  CORE_REF: dc61dd575a3d76a113f55a84175b6f36ba35e894

jobs:
  test:
    name: Python ${{ matrix.version }} (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [toolkit, mcp, a2a, cli]
        version: ['3.12']
        include:
          - component: toolkit
            version: '3.11'
    defaults:
      run:
        working-directory: ${{ matrix.component }}/python
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - &checkout-core
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: aiperceivable/apcore
          ref: ${{ env.CORE_REF }}
          path: .ci-apcore-core
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.version }}
      - &build-core-wheel
        name: Build the in-review Core wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir "$RUNNER_TEMP/core-wheel" "$GITHUB_WORKSPACE/.ci-apcore-core/python"
      - name: Install and verify local dependencies
        shell: bash
        run: |
          args=("$RUNNER_TEMP"/core-wheel/apcore-*.whl -e '.[dev]')
          if [[ "${{ matrix.component }}" != toolkit ]]; then
            args+=(-e "$GITHUB_WORKSPACE/toolkit/python")
          fi
          if [[ "${{ matrix.component }}" == a2a ]]; then
            args+=(aiohttp)
          fi
          if [[ -f constraints.txt ]]; then
            args+=(-c constraints.txt)
          fi
          python -m pip install "${args[@]}"
          python -m pip check
          python - <<'PY'
          import os
          from pathlib import Path
          import apcore_toolkit
          expected = Path(os.environ["GITHUB_WORKSPACE"]) / "toolkit/python/src/apcore_toolkit"
          assert Path(apcore_toolkit.__file__).resolve().parent == expected.resolve()
          PY
      - run: ruff check src/ tests/
      - run: python -m pytest

  package:
    name: Python distribution (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [toolkit, mcp, a2a, cli]
    defaults:
      run:
        working-directory: ${{ matrix.component }}/python
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - *checkout-core
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - *build-core-wheel
      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build
      - name: Install and import the built wheel in isolation
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          wheels=( "$PWD"/dist/*.whl "$RUNNER_TEMP"/core-wheel/apcore-*.whl )
          temporary=$(mktemp -d)
          if [[ "$COMPONENT" == a2a || "$COMPONENT" == cli ]]; then
            python -m build --wheel --outdir "$temporary/wheels" "$GITHUB_WORKSPACE/toolkit/python"
            wheels+=( "$temporary"/wheels/apcore_toolkit-*.whl )
          fi
          python -m venv "$temporary/venv"
          cd "$temporary"
          "$temporary/venv/bin/python" -m pip install "${wheels[@]}"
          "$temporary/venv/bin/python" -m pip check
          "$temporary/venv/bin/python" -c 'import importlib, sys; importlib.import_module("apcore_" + sys.argv[1])' "$COMPONENT"
