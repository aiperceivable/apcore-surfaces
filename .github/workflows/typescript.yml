name: TypeScript surfaces

on:
  push:
    branches: [main]
    paths: &typescript-paths
      - '*/typescript/**'
      - '*/conformance/**'
      - '.github/workflows/typescript.yml'
  pull_request:
    paths: *typescript-paths
  workflow_dispatch:

permissions:
  contents: read

env:
  CORE_REF: 9ba719587d9a288c22b8b5ff2a10a187a9a21cee

jobs:
  test:
    name: TypeScript (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [toolkit, mcp, a2a, cli]
    defaults:
      run:
        working-directory: ${{ matrix.component }}/typescript
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - &checkout-core
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: aiperceivable/apcore
          ref: ${{ env.CORE_REF }}
          path: .ci-apcore-core
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.30.1'
      - &build-core-npm
        name: Build the in-review Core npm distribution
        run: |
          core="$GITHUB_WORKSPACE/.ci-apcore-core/typescript"
          pnpm --dir "$core" install --frozen-lockfile
          pnpm --dir "$core" build
          pnpm --dir "$core" pack --pack-destination "$RUNNER_TEMP"
      - &install-dependencies
        name: Install dependencies with the Core archive and checkout Toolkit
        shell: bash
        run: |
          toolkit="$GITHUB_WORKSPACE/toolkit/typescript"
          archive=( "$RUNNER_TEMP"/apcore-js-*.tgz )
          installed=$(mktemp -d)
          npm install --prefix "$installed" --ignore-scripts --no-save --no-package-lock "${archive[0]}"
          core_root="$installed/node_modules/apcore-js"
          install_deps() (
            cd "$1"
            saved=$(mktemp -d)
            cp package.json pnpm-lock.yaml "$saved/"
            trap 'cp "$saved/package.json" "$saved/pnpm-lock.yaml" .; rm -rf "$saved"' EXIT
            CORE_ROOT="$core_root" TOOLKIT="$toolkit" node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';

          const file = 'package.json';
          const manifest = JSON.parse(readFileSync(file, 'utf8'));
          manifest.pnpm ??= {};
          const overrides = manifest.pnpm.overrides ??= {};
          overrides['apcore-js'] = 'link:' + process.env.CORE_ROOT;
          if (process.cwd() !== process.env.TOOLKIT) overrides['apcore-toolkit'] = 'link:' + process.env.TOOLKIT;
          writeFileSync(file, JSON.stringify(manifest, null, 2) + '\n');
          JS
            pnpm install --no-frozen-lockfile
          )
          install_deps "$toolkit"
          if [[ "$PWD" == "$toolkit" ]]; then exit; fi
          pnpm --dir "$toolkit" build
          install_deps "$PWD"
          TOOLKIT="$toolkit" node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { realpathSync } from 'node:fs';
          import { resolve } from 'node:path';
          import { fileURLToPath } from 'node:url';

          const expected = realpathSync(resolve(process.env.TOOLKIT, 'dist/index.js'));
          assert.equal(realpathSync(fileURLToPath(import.meta.resolve('apcore-toolkit'))), expected);
          JS
      - name: Run the toolkit source checks
        if: matrix.component == 'toolkit'
        run: |
          pnpm exec apdev-js check-chars src/ tests/
          pnpm exec apdev-js check-imports --package apcore-js
      - run: pnpm lint
        if: matrix.component != 'toolkit'
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - uses: oven-sh/setup-bun@v2
        if: matrix.component == 'toolkit'
        with:
          bun-version: 1.3.x
      - run: pnpm test:packaging
        if: matrix.component == 'toolkit'

  package:
    name: npm distribution (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [toolkit, mcp, a2a, cli]
    defaults:
      run:
        working-directory: ${{ matrix.component }}/typescript
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - *checkout-core
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.30.1'
      - *build-core-npm
      - *install-dependencies
      - run: pnpm build
      - name: Pack and install as an external consumer
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          temporary=$(mktemp -d)
          pnpm pack --pack-destination "$temporary"
          if [[ "$COMPONENT" != toolkit ]]; then
            toolkit="$GITHUB_WORKSPACE/toolkit/typescript"
            pnpm --dir "$toolkit" pack --pack-destination "$temporary"
          fi
          archives=( "$temporary"/*.tgz "$RUNNER_TEMP"/apcore-js-*.tgz )
          toolkit_archive=( "$temporary"/apcore-toolkit-*.tgz )
          cd "$temporary"
          npm init -y
          npm install "${archives[@]}"
          node --input-type=module - "apcore-$COMPONENT" "${toolkit_archive[0]}" <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, realpathSync } from 'node:fs';
          import { resolve } from 'node:path';

          const [, , name, toolkitArchive] = process.argv;
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const lockedToolkit = lock.packages['node_modules/apcore-toolkit'].resolved;
          assert.ok(lockedToolkit.startsWith('file:'));
          assert.equal(realpathSync(resolve(lockedToolkit.slice('file:'.length))), realpathSync(toolkitArchive));
          await import(name);
          if (name === 'apcore-toolkit') await import(name + '/browser');
          JS
