name: Build surface documentation

on:
  pull_request:
    paths:
      - '*/docs/**'
      - '*/mkdocs.yml'
      - '.github/workflows/docs.yml'
      - 'scripts/build-docs.sh'
      - '*/scripts/gen_llms_full.py'
      - '*/README.md'
      - '*/CHANGELOG.md'
      - '*/llms.txt'
  push:
    branches: [main]
    paths:
      - '*/docs/**'
      - '*/mkdocs.yml'
      - '.github/workflows/docs.yml'
      - 'scripts/build-docs.sh'
      - '*/scripts/gen_llms_full.py'
      - '*/README.md'
      - '*/CHANGELOG.md'
      - '*/llms.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [toolkit, mcp, a2a, cli]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install mkdocs-material
      - run: ./scripts/build-docs.sh "${{ matrix.component }}" "site/${{ matrix.component }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docs-${{ matrix.component }}
          path: site/${{ matrix.component }}/
