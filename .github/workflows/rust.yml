name: Rust surfaces

on:
  push:
    branches: [main]
    paths:
      - '*/rust/**'
      - '*/conformance/**'
      - '.github/workflows/rust.yml'
      - 'scripts/verify-rust-surface.py'
  pull_request:
    paths:
      - '*/rust/**'
      - '*/conformance/**'
      - '.github/workflows/rust.yml'
      - 'scripts/verify-rust-surface.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  # The released lockfiles already reference these prereleases. Bootstrap CI
  # from the reviewed Core commit while those versions are unpublished.
  CORE_REF: b28e1bfd01b804c8662e9e418d8487d0e08cc0ce
  CORE_CRATE_VERSION: 1.0.0-alpha.1
  CORE_CRATE_SHA256: bbc1db3680f3d81b7096fa5eb70476a2c043b333681c2a7bba3597a49bbf11f6

jobs:
  source:
    name: Rust source tests (${{ matrix.component }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        component: [toolkit, mcp, a2a, cli]
        os: [ubuntu-latest]
        include:
          - component: mcp
            os: windows-latest
    defaults:
      run:
        working-directory: ${{ matrix.component }}/rust
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: aiperceivable/apcore
          ref: ${{ env.CORE_REF }}
          path: .ci-apcore-core
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ matrix.component }}/rust/target
          key: ${{ runner.os }}-cargo-${{ matrix.component }}-${{ hashFiles('*/rust/Cargo.lock') }}
      - run: cargo fmt --all -- --check
      - name: Check and test against the pinned Core and checkout Toolkit
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          git -C "$GITHUB_WORKSPACE/.ci-apcore-core" rev-parse HEAD
          python "$GITHUB_WORKSPACE/scripts/verify-rust-surface.py" "$COMPONENT" source \
            "$GITHUB_WORKSPACE/.ci-apcore-core/rust"

  package:
    name: Rust crate verification (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [toolkit, mcp, a2a, cli]
    defaults:
      run:
        working-directory: ${{ matrix.component }}/rust
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: aiperceivable/apcore
          ref: ${{ env.CORE_REF }}
          path: .ci-apcore-core
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and verify the pinned Core archive digest
        working-directory: .ci-apcore-core/rust
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/core-dependency-target
        run: |
          git rev-parse HEAD
          rustup toolchain install 1.86.0 --profile minimal
          # Core was already verified upstream. Reproduce the same archive.
          cargo +1.86.0 package --locked --all-features --no-verify
          archive="$CARGO_TARGET_DIR/package/apcore-$CORE_CRATE_VERSION.crate"
          printf '%s  %s\n' "$CORE_CRATE_SHA256" "$archive" | sha256sum --check
          mkdir "$RUNNER_TEMP/core-dependency"
          tar -xzf "$archive" --strip-components=1 -C "$RUNNER_TEMP/core-dependency"
      - name: Package and verify the Surface crate
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          python "$GITHUB_WORKSPACE/scripts/verify-rust-surface.py" "$COMPONENT" package \
            "$RUNNER_TEMP/core-dependency"
