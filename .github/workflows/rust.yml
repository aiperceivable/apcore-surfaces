name: Rust surfaces

on:
  push:
    branches: [main]
    paths:
      - '*/rust/**'
      - '*/conformance/**'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - '*/rust/**'
      - '*/conformance/**'
      - '.github/workflows/rust.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Rust source tests (${{ matrix.component }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        component: [toolkit, mcp, a2a, cli]
        os: [ubuntu-latest]
        include:
          - component: mcp
            os: windows-latest
    defaults:
      run:
        working-directory: ${{ matrix.component }}/rust
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ matrix.component }}/rust/target
          key: ${{ runner.os }}-cargo-${{ matrix.component }}-${{ hashFiles('*/rust/Cargo.lock') }}
      - run: cargo fmt --all -- --check
      - name: Check and test toolkit
        if: matrix.component == 'toolkit'
        run: |
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-features
          cargo check --locked --no-default-features
      - name: Check and test the surface against this checkout's toolkit
        if: matrix.component != 'toolkit'
        shell: bash
        run: |
          patch="patch.crates-io.apcore-toolkit.path='$GITHUB_WORKSPACE/toolkit/rust'"
          cargo --config "$patch" metadata --format-version 1 | python -c '
          import json, sys
          from pathlib import Path
          expected = (Path(sys.argv[1]) / "toolkit/rust/Cargo.toml").resolve()
          packages = [p for p in json.load(sys.stdin)["packages"] if p["name"] == "apcore-toolkit"]
          if len(packages) != 1 or Path(packages[0]["manifest_path"]).resolve() != expected:
              raise SystemExit("Consumer did not resolve the toolkit from this checkout")
          ' "$GITHUB_WORKSPACE"
          cargo --config "$patch" clippy --all-targets --all-features -- -D warnings
          cargo --config "$patch" test --all-features
          cargo --config "$patch" build --examples
          if [[ "${{ matrix.component }}" == a2a ]]; then
            cargo --config "$patch" check --no-default-features
          fi

  package:
    name: Rust crate verification (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [toolkit, mcp, a2a, cli]
    defaults:
      run:
        working-directory: ${{ matrix.component }}/rust
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo package --locked
